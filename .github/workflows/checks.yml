# FIH checks: one shared pipeline for every FIH project.
# Projects call it with a small .github/workflows/fih-checks.yml file (see README.md).
#
# What it checks:
#   Secrets               leaked keys and passwords (gitleaks), and key/credential files by name
#   Clean repository      no node_modules, build output, virtual environments or very large files
#   Code scan             dangerous code patterns (Semgrep); on pull requests only new findings count
#   Vulnerable libraries  dependencies with known vulnerabilities (OSV-Scanner)
#   Build and tests       found automatically: Node.js (package.json), Python, Flutter (pubspec.yaml)
#   All checks passed     one summary result; make this the required check on `main`

name: FIH checks

on:
  workflow_call:
    inputs:
      block-on-code-findings:
        description: Fail when the code scan finds a problem (otherwise only warn)
        type: boolean
        default: true
      block-on-vulnerable-libraries:
        description: Fail when a dependency has a known vulnerability (otherwise only warn)
        type: boolean
        default: false
      node-version:
        type: string
        default: "22"
      python-version:
        type: string
        default: "3.12"
      flutter-version:
        description: Empty means the latest stable release
        type: string
        default: ""
      max-file-size-mb:
        description: Files larger than this are refused in pull requests
        type: number
        default: 10
      allow-build-folders:
        description: Allow build/ and dist/ folders (for projects that deliberately commit their built site)
        type: boolean
        default: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
  OSV_SCANNER_VERSION: 1.9.2
  OSV_SCANNER_SHA256: d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b

jobs:
  detect:
    name: Detect project type
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.find.outputs.node }}
      python: ${{ steps.find.outputs.python }}
      flutter: ${{ steps.find.outputs.flutter }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          dirs_with() {
            find . \( -name .git -o -name node_modules -o -name .venv -o -name venv \
                      -o -name build -o -name dist -o -name .dart_tool -o -name Pods \) -prune \
                   -o \( "$@" \) -type f -print0 \
              | xargs -0 -r -n1 dirname | sort -u | jq -R . | jq -sc .
          }
          node=$(dirs_with -name package.json)
          python=$(dirs_with -name requirements.txt -o -name pyproject.toml -o -name setup.py)
          flutter=$(dirs_with -name pubspec.yaml)
          {
            echo "node=$node"
            echo "python=$python"
            echo "flutter=$flutter"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Project folders found"
            echo "- Node.js: \`$node\`"
            echo "- Python: \`$python\`"
            echo "- Flutter: \`$flutter\`"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block key and credential files
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --diff-filter=AR "$BASE_SHA...$HEAD_SHA")
          else
            files=$(git ls-files)
          fi
          found=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$(basename "$path")" in
              .env.example|.env.sample|.env.template) ;;
              .env|.env.*|*.pem|*.key|*.p12|*.pfx|*.jks|*.keystore|id_rsa|id_ed25519|\
              *serviceAccount*.json|*service-account*.json|*.tfstate)
                echo "::error file=$path::'$path' looks like a key or credential file. Remove it and add it to .gitignore. Share keys with your team another way, never through git."
                found=1 ;;
            esac
          done <<< "$files"
          if [ "$found" = 0 ]; then echo "No key or credential files."; fi
          exit "$found"

      - name: Scan for leaked keys and passwords
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          if [ "$EVENT" = pull_request ]; then
            # Only the commits in this pull request, so old problems don't block students.
            /tmp/gitleaks git --no-banner --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            /tmp/gitleaks dir --no-banner --redact --verbose .
          fi

  hygiene:
    name: Clean repository
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MAX_MB: ${{ inputs.max-file-size-mb }}
      ALLOW_BUILD: ${{ inputs.allow-build-folders }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Block generated folders and large files
        run: |
          # Pull requests are blocked; on main, files that are already there only produce warnings.
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --diff-filter=AMR "$BASE_SHA...$HEAD_SHA")
            level=error
          else
            files=$(git ls-files)
            level=warning
          fi
          max_bytes=$((MAX_MB * 1024 * 1024))
          found=0
          declare -A reported
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            reason=""
            item="$path"
            for folder in node_modules .dart_tool .gradle Pods __pycache__ .venv venv build dist; do
              case "/$path" in
                */"$folder"/*)
                  item="/$path"
                  item="${item%%/"$folder"/*}/$folder/"
                  item="${item#/}"
                  case "$folder" in
                    node_modules) reason="installed packages are re-created by npm install" ;;
                    .venv|venv) reason="a Python virtual environment" ;;
                    build|dist)
                      if [ "$ALLOW_BUILD" != true ]; then reason="build output is re-created when the project is built"; fi ;;
                    *) reason="files generated by the tools" ;;
                  esac
                  break ;;
              esac
            done
            case "$path" in *.pyc) reason="files generated by the tools" ;; esac
            if [ -z "$reason" ] && [ -f "$path" ] && [ "$(stat -c %s "$path")" -gt "$max_bytes" ]; then
              reason="it is larger than $MAX_MB MB; keep large data, videos and archives out of git"
            fi
            if [ -n "$reason" ] && [ -z "${reported[$item]:-}" ]; then
              reported[$item]=1
              echo "::$level file=$item::'$item' should not be in git: $reason. Remove it and add it to .gitignore."
              found=1
            fi
          done <<< "$files"
          if [ "$found" = 0 ]; then
            echo "Repository is clean."
          elif [ "$level" = error ]; then
            exit 1
          fi

  code:
    name: Code scan
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    env:
      EVENT: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BLOCK: ${{ inputs.block-on-code-findings }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Semgrep
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          set -- --config p/default --metrics=off --error \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
          if [ "$EVENT" = pull_request ]; then
            set -- "$@" --baseline-commit "$BASE_SHA"
          fi
          if semgrep scan "$@"; then
            exit 0
          fi
          if [ "$BLOCK" = true ]; then
            echo "::error::The code scan found a problem (details above). Fix it, or if it is a false alarm add a '# nosemgrep' comment on that line and explain why in the pull request."
            exit 1
          fi
          echo "::warning::The code scan found a problem (details above)."

  dependencies:
    name: Vulnerable libraries
    runs-on: ubuntu-latest
    env:
      BLOCK: ${{ inputs.block-on-vulnerable-libraries }}
    steps:
      - uses: actions/checkout@v7
      - name: OSV-Scanner
        run: |
          curl -sSfL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          set +e
          /tmp/osv-scanner --recursive --skip-git .
          code=$?
          set -e
          case "$code" in
            0) echo "No known vulnerabilities." ;;
            128) echo "No dependency files found." ;;
            1)
              if [ "$BLOCK" = true ]; then
                echo "::error::Some dependencies have known vulnerabilities (table above). Update them to a fixed version."
                exit 1
              fi
              echo "::warning::Some dependencies have known vulnerabilities (table above). Update them when you can." ;;
            *) exit "$code" ;;
          esac

  node:
    name: Node.js build and tests
    needs: detect
    if: needs.detect.outputs.node != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.node) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f yarn.lock ]; then npx --yes yarn install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then npx --yes pnpm install --frozen-lockfile
          else npm install
          fi
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: |
          if node -e 'const t = (require("./package.json").scripts || {}).test || ""; process.exit(t && !t.includes("no test specified") ? 0 : 1)'; then
            npm test
          else
            echo "No test script in package.json."
          fi

  python:
    name: Python build and tests
    needs: detect
    if: needs.detect.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f setup.py ] || { [ -f pyproject.toml ] && grep -qE '^\[(project|build-system|tool\.poetry)\]' pyproject.toml; }; then
            pip install .
          fi
      - name: Check syntax
        run: python -m compileall -q -x '(^|/)(\.venv|venv|node_modules)/' .
      - name: Test
        run: |
          if [ -z "$(find . \( -name .venv -o -name venv -o -name node_modules \) -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit)" ]; then
            echo "No test files (test_*.py or *_test.py)."
            exit 0
          fi
          pip install pytest
          set +e
          python -m pytest
          code=$?
          if [ "$code" = 5 ]; then echo "pytest collected no tests."; exit 0; fi
          exit "$code"

  flutter:
    name: Flutter build and tests
    needs: detect
    if: needs.detect.outputs.flutter != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.flutter) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: |
          if [ -d test ]; then flutter test; else echo "No test folder."; fi

  result:
    name: All checks passed
    if: always()
    needs: [detect, secrets, hygiene, code, dependencies, node, python, flutter]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::Some FIH checks failed. Open the failed check in this list to see why."
            exit 1
          fi
          echo "All FIH checks passed."
